services:
  # Backend FastAPI Service
  - type: web
    name: agriai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: VECTOR_DB_TYPE
        value: pgvector
      - key: DATABASE_URL
        fromDatabase:
          name: agriai-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # Frontend React Static Site
  - type: web
    name: agriai-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.0.0

databases:
  - name: agriai-postgres
    databaseName: agriai_db
    user: agriai_user
    plan: free
    postgresMajorVersion: 16
