version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: smart-farming-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_farming_db
      MYSQL_USER: smart_farming_user
      MYSQL_PASSWORD: smart_farming_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant:latest
    container_name: smart-farming-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-farming-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+asyncmy://smart_farming_user:smart_farming_password@mysql:3306/smart_farming_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - JWT_SECRET_KEY=smart_farming_production_secret_key_change_in_env_2026
      - ENVIRONMENT=production
    depends_on:
      - mysql
      - qdrant

volumes:
  mysql_data:
  qdrant_data:

